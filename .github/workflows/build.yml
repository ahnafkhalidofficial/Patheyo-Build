name: Build Patheyo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    # Secrets না থাকলে ফাঁকা থাকবে; তখন শুধু সাধারণ debug কী দিয়ে debug APK তৈরি হবে (Google সাইন-ইন চলবে না)
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: কোড চেকআউট
        uses: actions/checkout@v5

      - name: সবচেয়ে নতুন জিপ এক্সট্র্যাক্ট
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | sed 's|^\./||' | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::রিপোর root-এ কোনো .zip ফাইল পাওয়া যায়নি।"
            exit 1
          fi
          echo "ব্যবহৃত জিপ: $ZIP"
          mkdir -p src
          unzip -q "$ZIP" -d src
          SETTINGS=$(find src -maxdepth 3 -name 'settings.gradle*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::জিপের ভেতরে settings.gradle.kts পাওয়া যায়নি।"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "প্রজেক্ট ফোল্ডার: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ZIP_STEM=$(basename "$ZIP" .zip)" >> "$GITHUB_ENV"
          # কম্পিউটারের SDK পথ (C:\AndroidSdk) Linux-এ কাজ করে না, তাই বাদ
          rm -f "$PROJECT_DIR/local.properties"
          # জিপে ভুলে থাকা পুরনো keystore.properties (Windows-পথ সহ) বাদ — নিচে Secrets থেকে নতুন বানানো হয়
          rm -f "$PROJECT_DIR/keystore.properties"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: JDK 21 সেটআপ
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK লাইসেন্স গ্রহণ
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle ক্যাশ
        uses: gradle/actions/setup-gradle@v4

      # ✅ আপনার patheyo-key.jks বসানো — debug APK এই কী দিয়ে সাইন হবে (SHA-1 = 02:F9:60…)
      # পেস্টের সময় ঢোকা অদৃশ্য ফাঁকা/নতুন লাইন বাদ দেয়, কী-ফাইল খোলা যায় কি না আগে যাচাই করে (ভুল হলে পরিষ্কার বার্তা)
      - name: সাইনিং কী বসানো ও যাচাই (Secrets থেকে)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          CLEAN() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          KEYSTORE_PASSWORD=$(CLEAN "$KEYSTORE_PASSWORD")
          KEY_ALIAS=$(CLEAN "$KEY_ALIAS")
          KEY_PASSWORD=$(CLEAN "$KEY_PASSWORD")
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t"' | base64 -d > "$RUNNER_TEMP/release.jks" \
            || { echo "::error::KEYSTORE_BASE64 ঠিক নেই (অসম্পূর্ণ বা ভুল কপি) — ধাপ ১ আবার করে নতুন করে বসান"; exit 1; }
          if ! keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/kt.txt" 2>&1; then
            echo "::error::কী-ফাইল খোলা গেল না — KEYSTORE_PASSWORD, KEY_ALIAS (patheyo) বা KEYSTORE_BASE64 ভুল"
            grep -i "error\|exception" "$RUNNER_TEMP/kt.txt" | head -3
            exit 1
          fi
          echo "কী-ফাইল ঠিক আছে। কীর SHA-1:"; grep "SHA1:" "$RUNNER_TEMP/kt.txt" | head -1
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$(esc "$KEYSTORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > keystore.properties

      - name: Debug APK বিল্ড
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: গোপন ফাইল মুছে ফেলা
        if: always()
        run: |
          rm -f "$PROJECT_DIR/keystore.properties" "$RUNNER_TEMP/release.jks"

      # ✅ নতুন: APK কোন SHA-1 দিয়ে সাইন হলো — Firebase-এর 02:F9:60:21… এর সাথে মিলতে হবে
      - name: সাইনিং SHA-1 দেখানো
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for APK in "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE"/out/*.apk; do
            [ -f "$APK" ] || continue
            echo "== $APK"
            "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-1" || true
          done

      - name: APK-গুলো গুছিয়ে নাম দেওয়া
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk "out/${ZIP_STEM}-debug.apk"
          ls -la out

      - name: APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_STEM }}-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
